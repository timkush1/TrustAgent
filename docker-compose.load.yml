# ============================================================================
# TrustAgent - load-test stack (SPEC §3.4; docs/GATEWAY.md §13)
# ============================================================================
# `make load-test-gate` runs, in effect:
#
#   docker compose -p truthtable-load -f docker-compose.yml -f docker-compose.load.yml \
#     --profile load up -d --build --wait proxy
#   docker run --rm --network container:<the proxy container> -v ./scripts/load:/scripts/load:ro \
#     -e BASE_URL=http://127.0.0.1:8080 ... grafana/k6 run /scripts/load/gateway-overhead.js
#                                       # once per scenario: a, b, c, e, f and g
#   ... -f docker-compose.load-slow-jev.yml up -d --wait --no-deps mock-jev-slow proxy   # then d
#   docker compose -p truthtable-load ... down --volumes
#
# Every vendor is mock-upstream (profile load), so nothing leaves the machine and nothing is
# spent: the fast check is the `compatible` backend on its TypeSafe-shaped /v1/systemone, answering
# at once, and the LLM upstream answers every request with -default-answer. mock-jev-slow is a
# second mock-upstream whose decisions take 150 ms (scenario d). The gateway reads the load policy
# in scripts/load/policies.yaml: one route per scenario. Deep audits are off in that policy, and
# the proxy runs without the audit engine (TRUTHTABLE_GRPC_ADDRESS is empty, and the engine is not
# a dependency here), so a load run needs no engine image and no engine start.
#
# The stack publishes no host port: k6 runs inside the proxy container's network namespace (it
# reads the proxy's /metrics on 127.0.0.1:8002 and the mocks' request totals there too), so a
# demo or `make up` stack can keep running next to it. Test mode is on so the k6 script can
# make mock-upstream hang one decision call (X-TrustAgent-Scenario: fault:hang@1, scenario f).
# Rate limits, the fast-check rate limit and the spend caps are lifted: they would shape the
# measurement, and every vendor here is a mock.

name: truthtable-load

x-load-env: &load-env
  TRUTHTABLE_TEST_MODE: "true"

x-mock-healthcheck: &mock-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 5s
  start_interval: 1s

services:
  proxy:
    ports: !reset []
    environment:
      <<: *load-env
      TRUTHTABLE_POLICY_FILE: /etc/trustagent-load/policies.yaml
      TRUTHTABLE_JEV_BACKEND: compatible
      TRUTHTABLE_JEV_BASE_URL: http://mock-upstream:8090
      TRUTHTABLE_JEV_PATH: /v1/systemone
      TRUTHTABLE_JEV_MODEL: typesafe/jev-1.13
      # mock-upstream accepts any key; this one only has to be non-empty.
      TRUTHTABLE_JEV_API_KEY: load-mock-upstream-key
      TRUTHTABLE_OPENROUTER_BASE_URL: http://mock-upstream:8090
      TRUTHTABLE_UPSTREAM_URL: http://mock-upstream:8090
      TRUTHTABLE_ANTHROPIC_UPSTREAM_URL: http://mock-upstream:8090
      TRUTHTABLE_FALLBACK_UPSTREAM_URL: http://mock-upstream:8090
      TRUTHTABLE_RATE_LIMIT_PER_MINUTE: "100000000"
      TRUTHTABLE_GATE_JEV_RPM: "100000000"
      TRUTHTABLE_SPEND_CAP_DECISION_USD_DAY: "0"
      TRUTHTABLE_SPEND_CAP_LLM_USD_DAY: "0"
      TRUTHTABLE_LOG_LEVEL: warn
      # No audit engine: deep audits are off (cmd/proxy/main.go runs without one).
      TRUTHTABLE_GRPC_ADDRESS: ""
      # No vendor credential reaches the load proxy.
      OPENROUTER_API_KEY: !reset null
      TYPESAFE_API_KEY: !reset null
      TRUTHTABLE_UPSTREAM_API_KEY: !reset null
      TRUTHTABLE_ANTHROPIC_UPSTREAM_API_KEY: !reset null
      TRUTHTABLE_FALLBACK_UPSTREAM_API_KEY: !reset null
    volumes:
      - ./scripts/load/policies.yaml:/etc/trustagent-load/policies.yaml:ro
    depends_on: !override
      postgres:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy

  engine:
    environment:
      <<: *load-env
      LLM_PROVIDER: mock
      LLM_FALLBACK: none
      # No vendor credential reaches the load engine, and nothing is traced out.
      OPENROUTER_API_KEY: !reset null
      ANTHROPIC_API_KEY: !reset null
      OPENAI_API_KEY: !reset null
      LANGSMITH_API_KEY: !reset null
      LANGSMITH_TRACING: "false"

  postgres:
    ports: !reset []

  dashboard:
    ports: !reset []

  # The LLM upstream and the fast check of scenarios a, b, c, e, f and g. A load run needs more CPU
  # than the e2e stack gives it, or the mock would shape the measurement.
  mock-upstream:
    profiles: !reset []
    command:
      ["/mock-upstream", "-chunk-delay", "5ms", "-default-answer", "Annual plans can be refunded within 30 days of purchase."]
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "1.0"

  # The 150 ms fast check of scenario d (docker-compose.load-slow-jev.yml points the proxy here).
  mock-jev-slow:
    image: ghcr.io/timkush1/truthtable-proxy:${TRUSTAGENT_VERSION:-edge}
    pull_policy: never
    profiles: [load]
    command: ["/mock-upstream", "-jev-latency", "150ms"]
    environment:
      MOCK_UPSTREAM_ADDR: ":8090"
    expose:
      - "8090"
    healthcheck: *mock-healthcheck
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "1.0"
    restart: unless-stopped
