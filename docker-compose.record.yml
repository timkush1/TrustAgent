# ============================================================================
# TrustAgent - demo recording stack (D123; `make record-demo`)
# ============================================================================
# scripts/record_demo.py runs this stack to record the public demo with the real
# fast check (Jev) and the real deep-audit judge, then exports each attempt to
# tmp/record-demo/<attempt>/ for review; ACCEPT=1 copies the reviewed tape to
# frontend-react/demo-data/recorded/ (SPEC §2.13, D208). It is a dry run unless
# CONFIRM=1; the plan, the ledger and the caps come first:
#
#   make record-demo                          # the plan, the caps, which keys it found
#   make record-demo CONFIRM=1                # one attempt (about $1 on your OpenRouter key)
#   make record-demo ACCEPT=1 ATTEMPT=<id>    # take the reviewed attempt; DISCARD=1 drops it
#
# What this overlay changes on top of docker-compose.yml:
# - the backends come from .env, as in `make up` (one OpenRouter key covers Jev
#   and the judge; docs/JEV-ACCESS.md); the recording refuses the mock, `off`,
#   a local endpoint (mock-upstream) and a judge on its fallback;
# - the generated answers (D208) come from OpenRouter: the default upstream is
#   https://openrouter.ai/api with OPENROUTER_API_KEY, and trafficgen sends
#   their model as openai/gpt-4o-mini with max_tokens 300. Scripted scenarios
#   carry test_response, so they make no upstream call;
# - test mode is on, so scripted scenarios send their answers as test_response
#   (trafficgen --record --upstream generated). The test-header seam
#   (internal/jev/testheaders.go) never sends test headers to a vendor host;
# - traces are written before the response returns (sync), as the export reads
#   them straight after the run;
# - daily caps of at most $0.50 of fast checks and $3 of deep audits, whatever
#   .env says; each attempt's tmp/record-demo/<attempt>/stack.yml lowers them
#   to what the ledger leaves (D208);
# - no judge fallback (a fallback verdict cannot be labelled recorded), no
#   public read, strict configuration, demo mode off;
# - nothing reachable from outside (D208): no service publishes a host port.
#   record_demo.py reads the gateway with `docker compose exec` (the proxy's
#   GET /api/status, trafficgen and export-replay run in its container), so the
#   stack never collides with `make up` (8080) or `make demo`;
# - no mock-upstream and no trafficgen loop: neither profile is enabled.
#
# Its own project, truthtable-record, with images tagged p6rec (record_demo.py
# sets TRUSTAGENT_VERSION=p6rec and builds them from this checkout): an attempt's
# stack stays up for the review and goes with its volumes (down -v) on ACCEPT or
# DISCARD. Without Docker, `make record-check-config` proves that the gateway
# accepts this environment under strict configuration with fake keys
# (proxy -check-config):
#
#   docker compose -p truthtable-record -f docker-compose.yml -f docker-compose.record.yml config -q

name: truthtable-record

x-record-env: &record-env
  TRUTHTABLE_DEMO_MODE: "false"
  TRUTHTABLE_TEST_MODE: "true"
  TRUTHTABLE_STRICT_CONFIG: "true"
  TRUTHTABLE_PUBLIC_READ: "false"

services:
  proxy:
    environment:
      <<: *record-env
      TRUTHTABLE_TRACE_FLUSH: sync
      TRUTHTABLE_SPEND_CAP_DECISION_USD_DAY: "0.50"
      TRUTHTABLE_SPEND_CAP_LLM_USD_DAY: "3"
      # D208: the generated answers come from OpenRouter, paid by the same key.
      TRUTHTABLE_UPSTREAM_URL: https://openrouter.ai/api
      TRUTHTABLE_UPSTREAM_API_KEY: ${OPENROUTER_API_KEY:-}
      # The key in-container trafficgen sends (TRUTHTABLE_API_KEYS gives it ingest, read and
      # content: --record reads GET /api/status first).
      TRAFFICGEN_API_KEY:
    ports: !reset []

  engine:
    environment:
      <<: *record-env
      LLM_FALLBACK: none

  postgres:
    ports: !reset []

  dashboard:
    ports: !reset []
