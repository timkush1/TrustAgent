# Trivy secret-scan configuration for the "Trivy (filesystem scan)" job in
# .github/workflows/security.yml (the job points TRIVY_SECRET_CONFIG at this file; it is also
# Trivy's default --secret-config, so `trivy fs .` from the repository root reads it too).
#
# It mirrors .gitleaks.toml: Trivy's built-in rules and built-in allow rules stay on (nothing here
# disables or redefines a rule), and the only path allowed is one whose keys are fake by design.
# Trivy's built-in "tests" allow rule already skips most test files (`_test.go`, `tests/`,
# `*.test.ts`), and the project's fake-key conventions (`sk-test-...`, `sk-or-v1-e2e-...`) match
# none of its built-in rules, so the detector vectors are the one entry needed. Never put a real
# key anywhere in the repository: the path below is allowed because its keys are synthetic, not
# because a key there would be harmless.
#
# Paths are matched relative to the scan root (`scan-ref: .`, the repository root).

allow-rules:
  # The Tier-0 secret detector's golden vectors (SPEC §3.4) carry secret-shaped strings on purpose
  # (AKIATESTONLYFAKE..., ghp_TESTONLY..., xoxb-...-TESTONLYFAKE): the detector must flag them, so
  # a secret scanner flags them too. gitleaks allows the same path.
  - id: detector-vectors
    description: Detector golden vectors, synthetic secrets the secret detector must flag
    path: '^contracts/vectors/detectors/[^/]+\.json$'
