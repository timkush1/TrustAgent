  TRUTHTABLE_JEV_MOCK_STRICT:
  TRUTHTABLE_JEV_MOCK_SEED:
  TRUTHTABLE_JEV_MOCK_LATENCY:
  # Budgets, Studio
  TRUTHTABLE_SPEND_CAP_DECISION_USD_DAY:
  TRUTHTABLE_SPEND_CAP_LLM_USD_DAY:
  TRUTHTABLE_SPEND_ENFORCING_RESERVE:
  TRUTHTABLE_STUDIO_CONFIRM_ABOVE_USD:
  TRUTHTABLE_DRYRUN_MAX_SAMPLES:

x-engine-env: &engine-env
  # Core
  TRUTHTABLE_LOG_LEVEL:
  TRUTHTABLE_STRICT_CONFIG:
  TRUTHTABLE_DEMO_MODE:
  TRUTHTABLE_READONLY:
  TRUTHTABLE_PUBLIC_READ:
  TRUTHTABLE_TEST_MODE:
  # Auth
  TRUTHTABLE_INTERNAL_TOKEN:
  # Policy and gate
  TRUTHTABLE_KNOWLEDGE_ENABLED:
  KNOWLEDGE_ENABLED:
  RAG_ENABLED:
  TRUTHTABLE_KNOWLEDGE_DEADLINE:
  # Decision model
  OPENROUTER_API_KEY:
  TRUTHTABLE_OPENROUTER_BASE_URL:
  TRUTHTABLE_JEV_APP_URL:
  TRUTHTABLE_JEV_APP_TITLE:
  # Engine: judge
  LLM_PROVIDER:
  LLM_MODEL:
  LLM_FALLBACK:
  ANTHROPIC_API_KEY:
  OPENAI_API_KEY:
  OPENROUTER_JUDGE_MODEL:
  OLLAMA_FALLBACK_MODEL:
  TRUTHTABLE_JUDGE_MAX_INFLIGHT:
  VERIFIER_CONCURRENCY:
  TRUTHTABLE_ANTHROPIC_STRUCTURED_OUTPUTS:
  # Engine: pipeline and server
  TRUTHTABLE_VERIFIER:
  VERIFIER_MODE:
  TRUTHTABLE_VERIFY_CONTEXT_SCOPE:
  TRUTHTABLE_AUDIT_EXTRACT_CLAIMS_WITHOUT_EVIDENCE:
  TRUTHTABLE_SCORING_PARTIAL_WEIGHT:
  TRUTHTABLE_SCORING_CONTRADICTION_FLAG:
  TRUTHTABLE_SCORING_UNSUPPORTED_FLAG:
  TRUTHTABLE_SCORING_UNSUPPORTED_FRACTION_FLAG:
  TRUTHTABLE_SCORING_MIN_COVERAGE:
  TRUTHTABLE_SCORING_MAX_UNKNOWN_FRACTION:
  TRUTHTABLE_SCORING_GRADE_CUTOFFS:
  TRUTHTABLE_UNSUPPORTED_POLICY:
  TRUTHTABLE_MAX_CLAIMS:
  TRUTHTABLE_RETRIEVER_TOP_K:
  TRUTHTABLE_RETRIEVER_SCORE_THRESHOLD:
  TRUTHTABLE_EMBEDDING_MODEL:
  TRUTHTABLE_ENGINE_MAX_RPCS:
  TRUTHTABLE_ENGINE_MAX_AUDITS:
  LOG_LEVEL:
  LANGSMITH_API_KEY:
  LANGSMITH_PROJECT:
  LANGSMITH_TRACING:

services:
  # ========== Default set ==========

  proxy:
    image: ghcr.io/timkush1/truthtable-proxy:${TRUSTAGENT_VERSION:-edge}
    pull_policy: missing
    build:
      context: .
      dockerfile: backend-go/Dockerfile
      args:
        VERSION: ${TRUSTAGENT_VERSION:-edge}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROXY_HOST_PORT:-8080}:8080"
    # Metrics (:8002) stay on the compose network (prometheus scrapes proxy:8002).
    expose:
      - "8002"
    environment:
      <<: *proxy-env
      TRUTHTABLE_PORT: "8080"
      TRUTHTABLE_METRICS_PORT: "8002"
      TRUTHTABLE_DATA_DIR: /var/lib/trustagent
      TRUTHTABLE_INTERNAL_TOKEN_FILE: /var/lib/trustagent-internal/internal.token
      TRUTHTABLE_DATABASE_URL: postgres://truthtable:${POSTGRES_PASSWORD:-}@postgres:5432/truthtable?sslmode=disable
      TRUTHTABLE_GRPC_ADDRESS: engine:50051
      TRUTHTABLE_POLICY_FILE: /etc/trustagent/policies.yaml
      TRUTHTABLE_EVALUATORS_DIR: /etc/trustagent/evaluators
      TRUTHTABLE_CALIBRATION_DIR: /etc/trustagent/calibration
      OLLAMA_BASE_URL: http://ollama:11434
      # X-Forwarded-For is trusted only from the compose network (the dashboard's
      # nginx). Docker allocates compose networks from 172.16.0.0/12; set the
      # exact subnet (docker network inspect <project>_default) to narrow it.
      TRUTHTABLE_TRUSTED_PROXIES: ${TRUTHTABLE_TRUSTED_PROXIES:-172.16.0.0/12}
      # The dashboard origin follows DASHBOARD_HOST_PORT unless set explicitly.
      TRUTHTABLE_PUBLIC_URL: ${TRUTHTABLE_PUBLIC_URL:-http://localhost:${DASHBOARD_HOST_PORT:-3000}}
      TRUTHTABLE_ALLOWED_ORIGINS: ${TRUTHTABLE_ALLOWED_ORIGINS:-http://localhost:${DASHBOARD_HOST_PORT:-3000},http://127.0.0.1:${DASHBOARD_HOST_PORT:-3000},http://localhost:5173}
    volumes:
      - ./config:/etc/trustagent:ro
      - trustagent-secrets:/var/lib/trustagent
      - trustagent-internal:/var/lib/trustagent-internal
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the proxy generates the internal token the engine
      # waits for, and it reports a missing engine itself (/health audit_engine).
      engine:
        condition: service_started
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Longer than TRUTHTABLE_SHUTDOWN_TIMEOUT (30s) so in-flight requests drain.
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    restart: unless-stopped

  engine:
    image: ghcr.io/timkush1/truthtable-engine:${TRUSTAGENT_VERSION:-edge}
    pull_policy: missing
    build:
      context: .
      dockerfile: backend-python/Dockerfile
      args:
        VERSION: ${TRUSTAGENT_VERSION:-edge}
        EXTRAS: ${ENGINE_EXTRAS:-}
    # gRPC (:50051) and metrics (:8001) stay on the compose network.
    expose:
      - "50051"
      - "8001"
    environment:
      <<: *engine-env
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
      METRICS_PORT: "8001"
      TRUTHTABLE_INTERNAL_TOKEN_FILE: /var/lib/trustagent-internal/internal.token
      TRUTHTABLE_CONTRACTS_DIR: /app/contracts
      OLLAMA_BASE_URL: http://ollama:11434
      # Used only when TRUTHTABLE_KNOWLEDGE_ENABLED=true (profile knowledge).
      QDRANT_URL: http://qdrant:6333
    volumes:
      - trustagent-internal:/var/lib/trustagent-internal:ro
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-m", "truthtable.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: truthtable
      POSTGRES_DB: truthtable
      # Generated into .env by `scripts/configure.py --ensure` (make up / demo).
      # Postgres refuses to initialise an empty data volume without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthtable -d truthtable"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped

  dashboard:
    image: ghcr.io/timkush1/truthtable-dashboard:${TRUSTAGENT_VERSION:-edge}
    pull_policy: missing
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
      args:
        VERSION: ${TRUSTAGENT_VERSION:-edge}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3000}:3000"
    # Written to /config.json and the nginx template at start (no secrets).
    # Explicit defaults: a bare `KEY:` entry that is unset would also unset the
    # image's own default.
    environment:
      DASHBOARD_API_BASE: ${DASHBOARD_API_BASE:-}
      DASHBOARD_WS_URL: ${DASHBOARD_WS_URL:-}
      DASHBOARD_PROXY_UPSTREAM: ${DASHBOARD_PROXY_UPSTREAM:-http://proxy:8080}
      DASHBOARD_CONNECT_SRC: ${DASHBOARD_CONNECT_SRC:-}
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    restart: unless-stopped

  # ========== Profile: demo ==========

  # Scripted traffic from contracts/demo/scenarios.v1.json. It needs the proxy in
  # test mode (test_response), which docker-compose.demo.yml turns on; make demo
  # enables this profile. Same image as the proxy, built by the proxy service
  # (pull_policy never: never pulled on its own, so an unpublished tag works).
  trafficgen:
    image: ghcr.io/timkush1/truthtable-proxy:${TRUSTAGENT_VERSION:-edge}
    pull_policy: never
    profiles: [demo]
    command: ["/trafficgen", "--loop", "--scenarios", "demo", "--base-url", "http://proxy:8080", "--interval", "20s"]
    environment:
      TRAFFICGEN_API_KEY:
    depends_on:
      proxy:
        condition: service_healthy
      engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    restart: unless-stopped

  # ========== Profile: knowledge ==========

  qdrant:
    image: qdrant/qdrant:v1.16.3
    profiles: [knowledge]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6333:6333" # HTTP API
      - "${BIND_ADDR:-127.0.0.1}:6334:6334" # gRPC API
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships no wget/curl; bash's /dev/tcp is a TCP connect check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ========== Profile: local-llm ==========

  ollama:
    image: ollama/ollama:0.5.13
    profiles: [local-llm]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # The ollama image ships no curl; the CLI hits the same HTTP API.
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    # GPU support (NVIDIA hosts):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the local judge model once (a no-op when it is present).
  ollama-init:
    image: ollama/ollama:0.5.13
    profiles: [local-llm]
    entrypoint: ["ollama", "pull", "${OLLAMA_FALLBACK_MODEL:-llama3.2:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ========== Profile: observability ==========

  prometheus:
    image: prom/prometheus:v2.48.0
    profiles: [observability]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    # Hybrid mode: scrape a proxy/engine running on the host (config/prometheus.yml).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    profiles: [observability]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Generated into .env by `scripts/configure.py --ensure`. Grafana would fall
      # back to admin/admin without it, so the entrypoint below refuses to start.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ -z "$${GF_SECURITY_ADMIN_PASSWORD}" ]; then
        echo "grafana: GRAFANA_ADMIN_PASSWORD is not set; run 'make configure' (scripts/configure.py --ensure)" >&2;
        exit 1; fi;
        exec /run.sh "$$@"
      - grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ========== Profile: redis ==========

  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  # Proxy only: TRUTHTABLE_DATA_DIR (secret.key).
  trustagent-secrets:
  # Proxy read-write, engine read-only: the internal RPC token.
  trustagent-internal:
  postgres-data:
  qdrant-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  redis-data:
