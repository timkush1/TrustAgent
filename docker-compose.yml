# ============================================================================
# TrustAgent - docker compose (SPEC §3.4)
# ============================================================================
# Default set: proxy, engine, postgres, dashboard.
#   make up                  configure --ensure, then `up -d --wait`; opens the dashboard
#   make demo                the zero-key demo stack (adds docker-compose.demo.yml)
#
# Add-ons are compose profiles (COMPOSE_PROFILES in .env, or --profile):
#   knowledge      qdrant (also set TRUTHTABLE_KNOWLEDGE_ENABLED=true and
#                  ENGINE_EXTRAS=knowledge, then rebuild the engine)
#   local-llm      ollama + ollama-init (pulls OLLAMA_FALLBACK_MODEL once)
#   observability  prometheus + grafana
#   redis          redis (also set REDIS_URL=redis://redis:6379)
#   demo           trafficgen (used by docker-compose.demo.yml / make demo)
#
# Conventions:
# - Every published port binds ${BIND_ADDR:-127.0.0.1}; set BIND_ADDR=0.0.0.0
#   only behind a firewall. Host ports: PROXY_HOST_PORT, DASHBOARD_HOST_PORT,
#   POSTGRES_HOST_PORT (per-worktree offsets go in that worktree's .env, next to
#   COMPOSE_PROJECT_NAME).
# - App images are ghcr.io/timkush1/truthtable-<svc>:${TRUSTAGENT_VERSION}
#   (make exports the contents of VERSION; `edge` otherwise). pull_policy
#   missing uses a local image, else pulls it, else builds it from this checkout
#   (build context: the repository root).
# - Every key in contracts/config/keys.v1.json that the proxy or the engine
#   reads is passed through from .env / the shell (x-proxy-env, x-engine-env
#   below); unset keys stay unset in the container. A bare `KEY:` that is unset
#   also clears an image ENV default, so the images set none of these keys.
#   Container wiring (ports, paths, service addresses) is fixed here instead,
#   so a host-oriented .env (make dev-go / dev-python) cannot break the stack.
# - No fixed container names: the project name (-p, COMPOSE_PROJECT_NAME or
#   `name`) isolates stacks, e.g. truthtable and truthtable-demo.

name: truthtable

# ---------- Environment passthrough ----------
# One entry per registry key (and alias) of the service, in registry order;
# scripts/tests/test_compose.py fails when a key is added to or removed from
# contracts/config/keys.v1.json without updating these lists. Keys of kind
# "path" and the wiring keys set per service below are left out on purpose.

