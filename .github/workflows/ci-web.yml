name: CI (Web)

# Dashboard (frontend-react/): eslint, TypeScript, vitest and a production
# build. Split out of the former ci.yml (SPEC §3.4, P0.5); the job id and name
# are unchanged so branch protection keeps matching "Frontend (dashboard)".
# No path filters on purpose: a required check that never reports would block
# merges.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generated from contracts/schema and committed: fail when a schema changed without
      # `make gen-types` / `make gen-policy-validator` (the vitest drift tests cover the same).
      - name: Contract types are current (gen-types-check)
        run: node scripts/gen-types.ts --check

      - name: Policy validator is current (gen-policy-validator-check)
        run: node scripts/gen-policy-validator.ts --check

      - name: eslint
        run: npm run lint

      - name: TypeScript
        run: npx tsc -b

      - name: vitest
        run: npm test

      - name: Production build
        run: npm run build
