name: CI (Docker)

# Builds the three service images (no push) so Dockerfile breakage fails the
# PR quickly. Split out of the former ci.yml (P0.5); the job id and name are
# unchanged so branch protection keeps matching "Docker builds". The images
# build from the repository root (SPEC §3.4) and generate their own gRPC stubs,
# so no toolchain is installed here. ci-e2e.yml builds the same images (same
# cache scopes) and runs them.
#
# Publishing is release-images.yml (D125): both platforms, pushed from main and
# release tags only, attested. It runs on a pull request only when a Dockerfile,
# a lockfile or the workflow changes, so this amd64 build stays the required
# check on every pull request. The arm64 job below is a smoke build of the two
# cross-compiled images (proxy, dashboard): not a required check, it shows an
# arm64 breakage before a release does.
# No path filters on purpose: a required check that never reports would block
# merges.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The version tag, and the git revision the images are labelled with (GIT_SHA).
      - name: Image version
        run: |
          echo "TRUSTAGENT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend-go/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          push: false
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend-react/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Build engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend-python/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          push: false
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

  arm64:
    name: Docker arm64 smoke (proxy, dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Image version
        run: |
          echo "TRUSTAGENT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The Go and dashboard builds run on the runner's platform and cross-compile;
      # QEMU runs only the final stages' few arm64 steps.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build proxy image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend-go/Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          push: false
          cache-from: type=gha,scope=proxy-arm64
          cache-to: type=gha,scope=proxy-arm64,mode=max

      - name: Build dashboard image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend-react/Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          push: false
          cache-from: type=gha,scope=dashboard-arm64
          cache-to: type=gha,scope=dashboard-arm64,mode=max
