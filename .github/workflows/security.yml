name: Security

# gosec (medium+), bandit, and npm audit (high+) are BLOCKING — the codebase
# was triaged clean in Phase 3 (see docs/SECURITY.md). Trivy remains
# informational until a full scheduled run has been reviewed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gosec:
    name: gosec (Go SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate gRPC stubs
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          protoc --proto_path=proto \
            --go_out=backend-go --go_opt=module=github.com/truthtable/backend-go \
            --go-grpc_out=backend-go --go-grpc_opt=module=github.com/truthtable/backend-go \
            proto/evaluator.proto

      # Blocking at medium+ severity; LOW-severity G104 (unhandled errors on
      # best-effort writes/closes) is accepted and tracked in docs/SECURITY.md.
      # gosec is version-pinned so a scanner release can't turn a green run red
      # without a deliberate bump.
      - name: Run gosec
        working-directory: backend-go
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude-dir=api -severity medium ./...

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run bandit
        run: |
          pip install bandit==1.9.4
          bandit -r backend-python/src -x backend-python/src/truthtable/grpc/pb

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Audit PRODUCTION dependencies only (--omit=dev). The shipped bundle is
      # react/react-dom/zustand; the build toolchain (Vite/esbuild) is dev-only
      # and its remaining HIGH advisories are dev-server issues that never ship
      # and are only fixable by a breaking Vite major (deliberately deferred —
      # see .github/dependabot.yml and docs/CI-CD.md). Real HIGH advisories in
      # shipped code still fail this gate.
      - name: Run npm audit (production deps)
        working-directory: frontend-react
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Trivy (filesystem scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # informational until a full scheduled run is reviewed
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
