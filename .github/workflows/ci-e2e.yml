name: CI (E2E)

# Compose end-to-end suite (SPEC §3.4) running the M-Demo gate (P3-PLAN §12,
# SPEC §4.2): the zero-key demo stack (make demo), trafficgen --expect over the
# demo scenarios, doctor --expect demo, the Playwright stack specs (the S0
# skeleton and the M-Demo set, signed in as admin with a key generated for the
# run), the static site's specs (built as the gate builds it and served by vite
# preview), then the e2e stack (every vendor on mock-upstream) with its p3
# scenarios, then the onboarding stack (a fresh install: setup link, Connect
# OpenRouter on mock-upstream, the wizard); compose logs are uploaded on
# failure. The scripts job lints and unit-tests the setup scripts the suite
# relies on, validates every compose profile and runs the gateway's
# -check-config against the onboarding and record stacks' environments. No path
# filters on purpose: a required check that never reports would block merges.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NO_COLOR: '1'

jobs:
  scripts:
    name: DX scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # Same pins as ci-python.yml; the settings come from the engine's pyproject. PyYAML and
      # jsonschema let the tests validate the load policy and the recording against contracts/.
      - name: Install linters and test dependencies
        run: pip install ruff==0.1.15 black==23.12.1 pyyaml==6.0.2 jsonschema==4.26.0

      - name: ruff
        run: ruff check --config backend-python/pyproject.toml scripts

      - name: black
        run: black --check --config backend-python/pyproject.toml scripts

      - name: Unit tests (scripts/tests)
        run: python -m unittest discover -s scripts/tests -v

      - name: Compose files (every profile and the demo, e2e, onboarding and load overrides)
        run: make compose-check

      # The onboarding stack must start under TRUTHTABLE_STRICT_CONFIG with backend auto and no
      # key (D70): run the gateway's -check-config on the host with the environment compose
      # gives its proxy, so a refusal shows here with its warnings instead of as an unhealthy
      # container in the E2E job. Same Go and stub setup as ci-go.yml.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate gRPC stubs
        run: make proto-tools proto-go

      - name: Onboarding stack configuration (proxy -check-config, strict, no key)
        run: make onboarding-check-config

      # The record stack (docker-compose.record.yml, D123): test mode with real backends under
      # strict configuration, proved with fake keys; nothing is started and nothing is called.
      - name: Record stack configuration (proxy -check-config, test mode, fake keys)
        run: make record-check-config

      - name: Workflow lint (actionlint, zizmor)
        run: make lint-workflows

  e2e:
    name: E2E (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker-compose.yml tags the app images with TRUSTAGENT_VERSION and builds
      # them with GIT_SHA (make exports both the same way: the contents of VERSION
      # and `git rev-parse --short HEAD`).
      - name: Image tag
        run: |
          echo "TRUSTAGENT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the three images with the tags and build args docker-compose.yml
      # uses, into the runner's docker, with a GitHub Actions layer cache; make
      # demo then starts them without rebuilding (DEMO_BUILD=).
      - name: Build proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend-go/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          tags: ghcr.io/timkush1/truthtable-proxy:${{ env.TRUSTAGENT_VERSION }}
          load: true
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

      - name: Build engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend-python/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          tags: ghcr.io/timkush1/truthtable-engine:${{ env.TRUSTAGENT_VERSION }}
          load: true
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend-react/Dockerfile
          build-args: |
            VERSION=${{ env.TRUSTAGENT_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          tags: ghcr.io/timkush1/truthtable-dashboard:${{ env.TRUSTAGENT_VERSION }}
          load: true
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      # configure.py --ensure writes a fresh .env (generated passwords and the
      # trafficgen key); then a random admin key goes into it for this run only.
      # The stack specs sign in with it (TRUSTAGENT_ADMIN_KEY; masked in the
      # log), and with an admin key set make demo mints no setup link.
      - name: Configure (.env and a one-run admin key)
        run: |
          python3 scripts/configure.py --ensure
          key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$key"
          printf 'TRUTHTABLE_ADMIN_KEYS=ci-admin=%s\n' "$key" >> .env
          echo "TRUSTAGENT_ADMIN_KEY=$key" >> "$GITHUB_ENV"

      # Every service must turn healthy. OPEN=0: print the URL, no browser.
      - name: make demo
        run: make demo DEMO_BUILD= OPEN=0

      # The M-Demo gate's command: the default scenario set (demo) at the default
      # phase; every selected scenario must pass (a phase skip fails the run).
      - name: Trafficgen --expect (demo scenarios)
        run: docker compose -p truthtable-demo exec -T proxy /trafficgen --once --expect

      - name: Doctor (--expect demo)
        run: python3 scripts/doctor.py --target docker --expect demo

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm # zizmor: ignore[cache-poisoning] this workflow publishes nothing (images are loaded, never pushed)
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dashboard dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      # playwright.config.ts points the stack project at
      # http://localhost:${DASHBOARD_HOST_PORT}, the port make demo published. In
      # CI a stack spec that cannot run fails instead of skipping.
      - name: Playwright (stack skeleton)
        working-directory: frontend-react
        env:
          DASHBOARD_HOST_PORT: '3000'
        run: npx playwright test --project=stack -g skeleton

      # One worker: the Studio, Savings and label specs change shared state
      # (evaluator drafts, budgets, labels) that the other specs read.
      - name: Playwright (stack, M-Demo, Studio, Savings and label specs)
        working-directory: frontend-react
        env:
          DASHBOARD_HOST_PORT: '3000'
        run: npx playwright test --project=stack --workers=1 -g "trace detail|inline claims|policy edit|rollback|fallback|studio|savings|labels|demo setup"

      # The static GitHub Pages site needs no stack. It is built as the M-Demo gate
      # builds it; --project=static makes Playwright serve it with vite preview
      # (SPEC §3.3, §7.5: replay, landing, CSP and network specs).
      - name: Playwright (static site)
        working-directory: frontend-react
        env:
          VITE_APP_MODE: static
          VITE_BASE_PATH: /TrustAgent/
        run: |
          npm run build
          npx playwright test --project=static

      # The e2e stack publishes the same host ports: the demo stops first.
      - name: Stop the demo stack
        run: make demo-clean

      # Real HTTP paths: the compatible fast-check backend and both LLM upstreams
      # on mock-upstream, traces written synchronously (docker-compose.e2e.yml).
      # The scenarios run at trafficgen's default phase (p5); the vendor-fault pack follows them,
      # since its last scenario (F8, credits) leaves the decision model in its auth cooldown.
      - name: E2E stack, its scenarios and the vendor faults
        run: make e2e-up E2E_BUILD= && make e2e-scenarios && make e2e-faults && make e2e-down

      # A fresh install (docker-compose.onboarding.yml): no admin key and no
      # fast-check key. The onboarding spec claims the one-time setup link,
      # connects OpenRouter through mock-upstream's sign-in page (published on
      # MOCK_UPSTREAM_HOST_PORT for the browser) and walks the wizard. Its own
      # ports, so nothing else has to stop first; the run's admin key is unset
      # so the spec signs in only through the setup link it claims.
      - name: Onboarding stack and its Playwright spec
        env:
          PROXY_HOST_PORT: '28080'
          DASHBOARD_HOST_PORT: '23000'
          POSTGRES_HOST_PORT: '25432'
          MOCK_UPSTREAM_HOST_PORT: '28090'
        run: |
          make onboarding-up ONBOARDING_BUILD=
          url="$(make -s onboarding-setup-url)"
          echo "::add-mask::$url"
          (cd frontend-react && env -u TRUSTAGENT_ADMIN_KEY TRUSTAGENT_SETUP_URL="$url" CI=1 \
            npx playwright test --project=stack --workers=1 -g onboarding)

      # Whichever stack was up when a step failed: the demo, the e2e stack or the
      # onboarding stack.
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-artifacts
          demo="docker compose -p truthtable-demo -f docker-compose.yml -f docker-compose.demo.yml --profile demo"
          e2e="docker compose -p truthtable-e2e -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e"
          onboarding="docker compose -p truthtable-onboarding -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.onboarding.yml --profile e2e"
          $demo ps --all > e2e-artifacts/compose-ps.txt 2>&1 || true
          $demo logs --no-color --timestamps > e2e-artifacts/compose.log 2>&1 || true
          $e2e ps --all > e2e-artifacts/compose-e2e-ps.txt 2>&1 || true
          $e2e logs --no-color --timestamps > e2e-artifacts/compose-e2e.log 2>&1 || true
          $onboarding ps --all > e2e-artifacts/compose-onboarding-ps.txt 2>&1 || true
          # The boot SETUP line carries a one-time token: mask it before upload.
          $onboarding logs --no-color --timestamps 2>&1 \
            | sed -E 's/(token=)[A-Za-z0-9_-]+/\1[masked]/g' > e2e-artifacts/compose-onboarding.log || true
          python3 scripts/doctor.py --target docker --expect demo --wait 0 --json \
            > e2e-artifacts/doctor.json 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/
            frontend-react/playwright-report/
            frontend-react/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: make -k demo-clean e2e-down onboarding-down
