# Every ecosystem waits 7 days after a release before proposing it (cooldown): a compromised
# release is usually pulled within days, before it reaches a pull request here. The workflows'
# actions are pinned to commit SHAs (D140) and the Dockerfiles' base images to index digests
# (D125); the github-actions and docker ecosystems move those pins together with their comments.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /backend-python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend-react
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Major bumps of the frontend toolchain (vite, typescript, eslint) are
    # real migrations, not routine updates; handle them deliberately.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories:
      - /backend-go
      - /backend-python
      - /frontend-react
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # torch / sentence-transformers publish no wheels for a brand-new Python
      # release for months, so moving python:3.11-slim to 3.12+ (a semver
      # *minor* bump to Dependabot) makes the engine image fall back to a source
      # build that fails. Bump the Python base image deliberately once the ML
      # wheels catch up; digest refreshes of the same tag still come through.
      # The FROM lines are pinned by tag and index digest (D125), which is what
      # lets Dependabot follow them at all.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Go stays on 1.26 (go.mod toolchain go1.26.x): every gosec release so far
      # is built on golang.org/x/tools older than v0.50.0, which cannot read Go
      # 1.27 export data, so the blocking gosec gate would pass without checking
      # anything. Lift this once gosec reads 1.27.
      - dependency-name: 'golang'
        versions: ['>=1.27']
      # node:22-alpine is the LTS line the dashboard build uses; a new major
      # (including the odd, non-LTS releases) is moved to deliberately.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  # Image pins in docker-compose.yml (SPEC §3.4). Keep ollama in step with the
  # service image pinned in .github/workflows/eval.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The schema targets Postgres 16 (SPEC §2.3: ≥14, compose pins 16);
      # a major bump needs a deliberate data-directory upgrade.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
