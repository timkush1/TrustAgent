version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /backend-python
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend-react
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Major bumps of the frontend toolchain (vite, typescript, eslint) are
    # real migrations, not routine updates; handle them deliberately.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /backend-go
      - /backend-python
      - /frontend-react
    schedule:
      interval: weekly
    ignore:
      # torch / sentence-transformers publish no wheels for a brand-new Python
      # release for months, so moving python:3.11-slim to 3.12+ (a semver
      # *minor* bump to Dependabot) makes the engine image fall back to a source
      # build that fails. Bump the Python base image deliberately once the ML
      # wheels catch up; digest refreshes of the same tag still come through.
      # The FROM lines are pinned by tag and index digest (D125), which is what
      # lets Dependabot follow them at all.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Image pins in docker-compose.yml (SPEC §3.4). Keep ollama in step with the
  # service image pinned in .github/workflows/eval.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The schema targets Postgres 16 (SPEC §2.3: ≥14, compose pins 16);
      # a major bump needs a deliberate data-directory upgrade.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
