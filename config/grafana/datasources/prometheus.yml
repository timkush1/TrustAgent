# yaml-language-server: $schema=https://json.schemastore.org/grafana-datasource.json

apiVersion: 1

datasources:
  - name: Prometheus
    # The dashboards reference this uid (config/grafana/dashboards/*.json).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
