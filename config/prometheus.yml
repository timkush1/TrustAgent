global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'truthtable'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Each app job lists two targets: the compose service name (all-Docker mode,
  # `COMPOSE_PROFILES=observability make up`) and host.docker.internal (hybrid
  # mode: the app runs natively on the host via make dev-go / dev-python; the
  # prometheus service maps that name to the host gateway). Whichever is alive
  # gets scraped; the other just shows as down.
  - job_name: 'proxy'
    static_configs:
      - targets: ['proxy:8002', 'host.docker.internal:8002']
    metrics_path: '/metrics'

  - job_name: 'engine'
    static_configs:
      - targets: ['engine:8001', 'host.docker.internal:8001']
    metrics_path: '/metrics'
