# ============================================================================
# TrustAgent - a local rehearsal of the public demo
# ============================================================================
# Layered on docker-compose.public.yml by `make public-demo-up` when
# TRUTHTABLE_PUBLIC_URL is http://localhost:28443 (scripts/public_demo.py url accepts no
# other http address). Caddy then serves plain HTTP on 127.0.0.1:28443: nothing listens on
# the machine's ports 80 or 443, nothing is reachable from the network, and no certificate
# is requested. Give the rehearsal a project of its own, and images you built, e.g.
#
#   TRUTHTABLE_PUBLIC_URL=http://localhost:28443 make public-demo-up \
#     PUBLIC_DEMO_PROJECT=truthtable-p6pub TRUSTAGENT_VERSION=<a local tag>
#   make public-demo-clean PUBLIC_DEMO_PROJECT=truthtable-p6pub
#
# Images that exist locally are not pulled again in a rehearsal (pull --policy missing).

services:
  caddy:
    ports: !override
      - "127.0.0.1:28443:28443"
