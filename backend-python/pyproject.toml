[tool.poetry]
name = "truthtable"
version = "1.0.0"
description = "TruthTable AI Audit Engine - Hallucination Detection Service"
authors = ["Tim Kushmaro <timk@mail.tau.ac.il>"]
readme = "README.md"
packages = [{include = "truthtable", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
langgraph = "^0.0.20"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"
qdrant-client = "^1.16.0"
redis = "^5.0.0"
prometheus-client = "^0.19.0"
sentence-transformers = ">=5.0.0"
# CPU-only torch: the default PyPI wheels bundle CUDA (multiple GB). This keeps
# `poetry install` lean and matches the CI / Dockerfile install path.
torch = { version = ">=2.0.0", source = "pytorch-cpu" }
numpy = ">=1.24.0"

# Explicit source used ONLY by torch (priority = explicit), so nothing else is
# pulled from the PyTorch index.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.9"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = 'src/truthtable/grpc/pb'

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/truthtable/grpc/pb"]

[tool.ruff.lint.per-file-ignores]
# Scripts adjust sys.path before importing the package
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
# e2e/integration tests need live services and are opt-in: a plain `pytest` run
# deselects them, and a later `-m e2e` (as in `make test-e2e`) overrides this.
addopts = "-m 'not e2e and not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests requiring the running stack (opt-in; run via `make test-e2e`)",
    "integration: tests requiring live services such as Qdrant (opt-in)",
]
